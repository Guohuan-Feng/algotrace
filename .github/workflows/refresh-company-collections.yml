name: Refresh company collection snapshots

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web refresh:company-collections
      - run: pnpm --dir apps/web test src/catalog/companyCollections/index.test.ts
      - name: Commit a validated snapshot update
        run: |
          if git diff --quiet -- apps/web/src/catalog/companyCollections/snapshots.generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/catalog/companyCollections/snapshots.generated.ts
          git commit -m "chore: refresh company collection snapshots"
          git push
